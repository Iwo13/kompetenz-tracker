var zoom="sem",drag=null;
function CW(){return zoom==="sem"?104:38;}
function NC(){return zoom==="sem"?14:TMO;}
function mToX(m){return zoom==="sem"?(m/6)*CW():m*CW();}
/* Signed month delta from pixel delta */
function dxToMo(dx){return zoom==="sem"?Math.round(dx/CW()*6):Math.round(dx/CW());}
/* Bar: v inclusive, b inclusive. Right edge = mToX(b+1) so adjacent bars are seamless */
function barGeom(rot){var x=mToX(rot.v);var w=Math.max(mToX(rot.b+1)-x,18);return{x:x,w:w};}

function flatRows(){var o=[];for(var i=0;i<SECS.length;i++){var s=SECS[i];o.push({sec:1,label:s.label});for(var j=0;j<s.rows.length;j++)o.push({sec:0,row:s.rows[j]});}return o;}
function findRow(id){for(var i=0;i<SECS.length;i++)for(var j=0;j<SECS[i].rows.length;j++)if(SECS[i].rows[j].id===id)return SECS[i].rows[j];}

function buildLegend(){
  var h="";var keys=Object.keys(APC);
  for(var i=0;i<keys.length;i++){
    var c=keys[i];
    h+='<div class="lchip" draggable="true" data-ap="'+c+'" title="Auf eine Zeile ziehen zum Zuweisen"><div class="ldot" style="background:'+APC[c]+'"></div>'+c+" - "+APN[c]+"</div>";
  }
  document.getElementById("legend").innerHTML=h;
  /* Attach drag events to chips */
  var chips=document.getElementById("legend").querySelectorAll(".lchip");
  chips.forEach(function(chip){
    chip.addEventListener("dragstart",function(e){
      e.dataTransfer.setData("ap",chip.dataset.ap);
      e.dataTransfer.effectAllowed="copy";
      chip.classList.add("dragging-chip");
    });
    chip.addEventListener("dragend",function(){chip.classList.remove("dragging-chip");});
  });
}

/* Compute conflicts: returns map ap -> set of months with >1 occupancy */
function computeConflicts(){
  var counts={};
  for(var i=0;i<SECS.length;i++){
    var rows=SECS[i].rows;
    for(var j=0;j<rows.length;j++){
      var r=rows[j];
      for(var k=0;k<r.rots.length;k++){
        var rot=r.rots[k];var ap=rot.ap;
        if(!counts[ap])counts[ap]={};
        for(var m2=rot.v;m2<=rot.b;m2++){counts[ap][m2]=(counts[ap][m2]||0)+1;}
      }
    }
  }
  /* Conflict months: count > 1 */
  var conflicts={};
  var aps=Object.keys(counts);
  for(var i=0;i<aps.length;i++){
    var ap=aps[i];var ms=Object.keys(counts[ap]);
    for(var j=0;j<ms.length;j++){
      if(counts[ap][ms[j]]>1){if(!conflicts[ap])conflicts[ap]={};conflicts[ap][ms[j]]=1;}
    }
  }
  return conflicts;
}

function rotHasConflict(rot,conflicts){
  if(!conflicts[rot.ap])return false;
  for(var m2=rot.v;m2<=rot.b;m2++){if(conflicts[rot.ap][m2])return true;}
  return false;
}

function buildNames(){
  var flat=flatRows();var h="";
  for(var i=0;i<flat.length;i++){
    var it=flat[i];
    if(it.sec){h+='<div class="sec-l">'+it.label+"</div>";}
    else{var r=it.row;h+='<div class="name-row'+(r.ht?" ht":"")+'"><div class="rname'+(r.ht?" htn":"")+'">'+r.name+'</div><div class="lv lv-'+r.lv+'">'+r.lv+"</div></div>";}
  }
  document.getElementById("namesContent").innerHTML=h;
}

function buildChart(){
  var canvas=document.getElementById("canvas");
  canvas.innerHTML="";
  var W=NC()*CW();
  canvas.style.width=W+"px";

  /* Timeline header */
  var thead=document.createElement("div");thead.className="tlhead";thead.style.width=W+"px";
  var yr=document.createElement("div");yr.className="year-row";
  var ym={};
  for(var i=0;i<NC();i++){var y=zoom==="sem"?(2024+Math.floor(i/2)):(SY+Math.floor(i/12));ym[y]=(ym[y]||0)+1;}
  var ykeys=Object.keys(ym);
  for(var i=0;i<ykeys.length;i++){var c=document.createElement("div");c.className="ycell";c.style.width=(ym[ykeys[i]]*CW())+"px";c.textContent=ykeys[i];yr.appendChild(c);}
  thead.appendChild(yr);
  var cr=document.createElement("div");cr.className="col-row";
  for(var i=0;i<NC();i++){
    var c=document.createElement("div");
    var grp=Math.floor(i/(zoom==="sem"?1:6))%2;
    c.className="ccell "+(grp===0?"odd":"even");c.style.width=CW()+"px";
    if(zoom==="sem"){var yy=2024+Math.floor(i/2);c.textContent=i%2===0?(String(yy).slice(2)+"Fr"):(String(yy).slice(2)+"He");}
    else{c.textContent=MO[i%12];c.style.fontSize="9px";}
    cr.appendChild(c);
  }
  thead.appendChild(cr);canvas.appendChild(thead);

  /* Content area */
  var cc=document.createElement("div");cc.className="cc";cc.style.width=W+"px";

  /* Grid lines */
  var grid=document.createElement("div");grid.className="grid";
  for(var i=0;i<=NC();i++){
    var l=document.createElement("div");l.className="gl";l.style.left=(i*CW())+"px";
    if(zoom==="sem"){l.style.width=i%2===0?"2px":"1px";l.style.background=i%2===0?"#d1d5db":"#f0f0f0";}
    else{l.style.width=i%12===0?"2px":i%6===0?"1.5px":"1px";l.style.background=i%12===0?"#d1d5db":i%6===0?"#e5e7eb":"#f5f5f5";}
    grid.appendChild(l);
  }
  cc.appendChild(grid);

  /* Today marker */
  var tl=document.createElement("div");tl.className="tl";tl.style.left=mToX(TODAY)+"px";tl.style.bottom="0";
  tl.innerHTML='<div class="tl-lbl">Heute</div>';cc.appendChild(tl);

  /* Pre-compute conflicts */
  var conflicts=computeConflicts();

  /* Data rows */
  var top=0;var flat=flatRows();
  for(var i=0;i<flat.length;i++){
    var it=flat[i];
    if(it.sec){
      var d=document.createElement("div");d.className="sec-r";d.style.top=top+"px";cc.appendChild(d);top+=SEC_H;
    } else {
      var r=it.row;
      var rd=document.createElement("div");rd.className="drow";rd.style.top=top+"px";rd.style.height=ROW_H+"px";
      /* Drop target for AP chips from legend */
      (function(r,rd){
          rd.addEventListener("dragover",function(e){e.preventDefault();e.dataTransfer.dropEffect="copy";rd.classList.add("drop-target");});
          rd.addEventListener("dragleave",function(){rd.classList.remove("drop-target");});
          rd.addEventListener("drop",function(e){
            e.preventDefault();rd.classList.remove("drop-target");
            var ap=e.dataTransfer.getData("ap");if(!ap)return;
            /* Calculate drop month from x position */
            var cp=document.getElementById("cp");
            var rect=cp.getBoundingClientRect();
            var xInChart=e.clientX-rect.left+cp.scrollLeft;
            var dropMo=zoom==="sem"?Math.floor(xInChart/CW()*6):Math.floor(xInChart/CW());
            dropMo=Math.max(0,Math.min(dropMo,TMO-7));
            var defLen=zoom==="sem"?6:6; /* default 6 months */
            r.rots.push({ap:ap,v:dropMo,b:dropMo+defLen-1});
            buildChart();
          });
        })(r,rd);
      /* Lehr background - full row height */
      var lx0=mToX(Math.max(r.lv0,0));var lx1=mToX(Math.min(r.lv1+1,TMO));
      if(lx1>lx0){
        var lb=document.createElement("div");lb.className="lehr-bg";
        lb.style.left=lx0+"px";lb.style.width=(lx1-lx0)+"px";
        lb.style.background=r.ht?"rgba(148,163,184,.15)":"rgba(219,234,254,.45)";
        rd.appendChild(lb);
      }
      /* Remaining badge */
      if(!r.ht&&r.lv1>TODAY){
        var rem=r.lv1-TODAY;var rb=document.createElement("div");rb.className="rem";
        rb.style.left=(mToX(r.lv1+1)+3)+"px";rb.textContent="noch "+rem+" Mt.";rd.appendChild(rb);
      }
      /* Rotation bars - use closure to capture r and ri correctly */
      (function(r){
        for(var ri=0;ri<r.rots.length;ri++){
          (function(ri){
            var rot=r.rots[ri];
            var g=barGeom(rot);
            var isConflict=rotHasConflict(rot,conflicts);
            var bar=document.createElement("div");
            bar.className="bar"+(r.ht?" ht-bar":"")+(isConflict?" conflict":"");
            bar.style.left=g.x+"px";bar.style.width=g.w+"px";
            bar.style.background=APC[rot.ap]||"#888";
            bar.innerHTML='<div class="hdl hdl-l"></div><div class="bar-lbl">'+rot.ap+'</div><div class="hdl hdl-r"></div><div class="del-btn">x</div>';
            /* Move: drag on bar body */
            bar.addEventListener("mousedown",function(e){
              if(e.target.classList.contains("hdl")||e.target.classList.contains("del-btn"))return;
              startDrag(e,bar,r,ri,"move");
            });
            /* Left handle */
            bar.querySelectorAll(".hdl")[0].addEventListener("mousedown",function(e){
              e.stopPropagation();startDrag(e,bar,r,ri,"left");
            });
            /* Right handle */
            bar.querySelectorAll(".hdl")[1].addEventListener("mousedown",function(e){
              e.stopPropagation();startDrag(e,bar,r,ri,"right");
            });
            /* Delete */
            bar.querySelector(".del-btn").addEventListener("click",function(e){
              e.stopPropagation();
              if(confirm('Einsatz "'+rot.ap+'" entfernen?')){r.rots.splice(ri,1);buildChart();}
            });
            /* Tooltip */
            bar.addEventListener("mousemove",function(e){
              if(drag)return;
              var rot2=r.rots[ri];
              var d2=function(m){var y=SY+Math.floor(m/12);var mn=((m%12)+12)%12;return MO[mn]+" "+y;};
              var tt=document.getElementById("tip");
              tt.innerHTML="<b>"+rot2.ap+"</b> - "+(APN[rot2.ap]||"")+(r.ht?" <span style='color:#94a3b8;font-size:10px;'>(Extern)</span>":"")+"<br>"+d2(rot2.v)+" bis "+d2(rot2.b);
              tt.style.display="block";tt.style.left=(e.clientX+14)+"px";tt.style.top=(e.clientY-8)+"px";
            });
            bar.addEventListener("mouseleave",function(){if(!drag)document.getElementById("tip").style.display="none";});
            rd.appendChild(bar);
          })(ri);
        }
      })(r);
      cc.appendChild(rd);top+=ROW_H;
    }
  }
  cc.style.height=top+"px";canvas.appendChild(cc);
  buildCap();
}

function buildCap(){
  var ci=document.getElementById("capIn");ci.innerHTML="";ci.style.width=(NC()*CW())+"px";
  for(var i=0;i<NC();i++){
    var c=document.createElement("div");c.className="cap-cell";c.style.width=CW()+"px";
    c.style.background=Math.floor(i/(zoom==="sem"?1:6))%2===0?"#f8fafc":"#fff";ci.appendChild(c);
  }
}

function startDrag(e,barEl,row,ri,mode){
  e.preventDefault();e.stopPropagation();
  var rot=row.rots[ri];
  drag={row:row,ri:ri,mode:mode,startX:e.clientX,origV:rot.v,origB:rot.b,bar:barEl};
  barEl.classList.add("dragging");
  document.addEventListener("mousemove",onMove);
  document.addEventListener("mouseup",onUp);
}

function onMove(e){
  if(!drag)return;
  var dx=e.clientX-drag.startX;
  var dmo=dxToMo(dx);
  var rot=drag.row.rots[drag.ri];
  var mn=1; /* minimum 1 month duration */
  if(drag.mode==="move"){var dur=drag.origB-drag.origV;rot.v=Math.max(0,drag.origV+dmo);rot.b=rot.v+dur;}
  else if(drag.mode==="left"){rot.v=Math.max(0,Math.min(drag.origV+dmo,drag.origB-mn));}
  else{rot.b=Math.max(drag.origB+dmo,drag.origV+mn);}
  var g=barGeom(rot);drag.bar.style.left=g.x+"px";drag.bar.style.width=g.w+"px";
}

function onUp(){
  if(!drag)return;
  document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);
  drag.bar.classList.remove("dragging");
  document.getElementById("tip").style.display="none";
  drag=null;
}

function setZoom(z){
  zoom=z;
  document.getElementById("btn-sem").classList.toggle("active",z==="sem");
  document.getElementById("btn-mon").classList.toggle("active",z==="mon");
  buildChart();scrollToday();
}

function initSync(){
  var cp=document.getElementById("cp");
  var ns=document.getElementById("namesContent").parentElement;
  cp.addEventListener("scroll",function(){ns.scrollTop=cp.scrollTop;},{passive:true});
}

function scrollToday(){document.getElementById("cp").scrollLeft=Math.max(0,mToX(TODAY)-200);}

function openModal(){
  var sp=document.getElementById("m-p");sp.innerHTML="";
  for(var i=0;i<SECS.length;i++)for(var j=0;j<SECS[i].rows.length;j++){var r=SECS[i].rows[j];if(!r.ht)sp.innerHTML+='<option value="'+r.id+'">'+r.name+"</option>";}
  var sa=document.getElementById("m-a");sa.innerHTML="";var ks=Object.keys(APN);
  for(var i=0;i<ks.length;i++){var c=ks[i];sa.innerHTML+='<option value="'+c+'">'+c+" - "+APN[c]+"</option>";}
  document.getElementById("m-v").value="2026-08";document.getElementById("m-b").value="2027-01";
  document.getElementById("modal").style.display="flex";
}
function closeModal(){document.getElementById("modal").style.display="none";}
function saveAss(){
  var rid=document.getElementById("m-p").value;var ap=document.getElementById("m-a").value;
  var von=document.getElementById("m-v").value;var bis=document.getElementById("m-b").value;
  if(!von||!bis||von>bis){alert("Bitte gueltige Von/Bis-Daten waehlen.");return;}
  var parse=function(s){var p=s.split("-");return mo(parseInt(p[0]),parseInt(p[1]));};
  findRow(rid).rots.push({ap:ap,v:parse(von),b:parse(bis)});
  closeModal();buildChart();
}

buildLegend();buildNames();buildChart();initSync();scrollToday();
</script>
